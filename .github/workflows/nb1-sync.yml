name: NB I API-szinkron

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Futtatási mód"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - write

  schedule:
  - cron: "*/5 * * * *"
    timezone: "Europe/Budapest"

permissions:
  contents: read

concurrency:
  group: nb1-sync
  cancel-in-progress: false

jobs:
  sync:
    name: NB I meccsek szinkronizálása
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v6

      - name: Node.js beállítása
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Függőségek telepítése
        run: npm install --no-audit --no-fund

      - name: Futtatási mód beállítása
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "write" ]; then
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
            echo "ÉLES FIRESTORE-ÍRÁS"
          else
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
            echo "ELŐNÉZET – NINCS FIRESTORE-ÍRÁS"
          fi

      - name: NB I-szinkron futtatása
        run: npm run sync:nb1
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          THESPORTSDB_API_KEY: "123"
          LOOKBACK_DAYS: "10"
          LOOKAHEAD_DAYS: "14"
          RELEASE_DELAY_HOURS: "26"
