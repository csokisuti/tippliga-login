
name: Admin jelszo visszaallitasa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-password:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository letoltese
        uses: actions/checkout@v6

      - name: Node.js beallitasa
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Fuggosegek telepitese
        run: npm install --no-audit --no-fund

      - name: Admin jelszo modositasa
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ADMIN_RECOVERY_PASSWORD: ${{ secrets.ADMIN_RECOVERY_PASSWORD }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { initializeApp, cert } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';

          const projectId = 'tippliga-4b3af';
          const email = 'krisz@krisz.com';

          const raw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
          const password = process.env.ADMIN_RECOVERY_PASSWORD;

          if (!raw || !password || password.length < 12) {
            throw new Error('Hianyzo hitelesites vagy tul rovid jelszo.');
          }

          const serviceAccount = JSON.parse(raw);

          if (serviceAccount.project_id !== projectId) {
            throw new Error('Nem megfelelo Firebase projekt.');
          }

          initializeApp({
            credential: cert(serviceAccount),
            projectId
          });

          const auth = getAuth();
          const user = await auth.getUserByEmail(email);

          if (user.email !== email) {
            throw new Error('A celzott felhasznalo nem egyezik.');
          }

          console.log('Celzott UID:', user.uid);
          console.log('Jelszo modositasa indul.');

          await auth.updateUser(user.uid, { password });

          console.log('SIKER: Az adminfiok jelszava modositva.');
          NODE
